# Reverse proxy for the self-hosted MinIO object storage, running in Docker on
# 127.0.0.1:9000 (see backend/docker-compose.prod.yml). This MUST be publicly reachable
# with HTTPS - uploads/downloads use presigned URLs that the browser hits directly, not
# routed through the API. Copy this into /etc/nginx/sites-available/ on the server,
# symlink it into sites-enabled/, then run:
#   sudo certbot --nginx -d lms-storage.jab-eri.org
# certbot rewrites this file in place to add the 443/SSL server block and the
# 80 -> 443 redirect - don't hand-add TLS directives here beforehand.
#
# Directives below (ignore_invalid_headers off, client_max_body_size 0, proxy_buffering
# off) match MinIO's own documented nginx reverse-proxy guidance.

server {
    listen 80;
    server_name lms-storage.jab-eri.org;

    ignore_invalid_headers off;
    client_max_body_size 0;
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;
    }
}
