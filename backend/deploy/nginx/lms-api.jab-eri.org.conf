# Reverse proxy for the TrainingPlatform API, running in Docker on 127.0.0.1:5001
# (see backend/docker-compose.prod.yml). Port 5000 was already taken on this server by
# jobboard-api-1, so this project uses 5001 instead. Copy this into
# /etc/nginx/sites-available/ on the server, symlink it into sites-enabled/, then run:
#   sudo certbot --nginx -d lms-api.jab-eri.org
# certbot rewrites this file in place to add the 443/SSL server block and the
# 80 -> 443 redirect - don't hand-add TLS directives here beforehand.

server {
    listen 80;
    server_name lms-api.jab-eri.org;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
