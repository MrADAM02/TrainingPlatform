name: trainingplatform

services:
  postgres:
    image: postgres:17
    container_name: training-platform-postgres
    environment:
      POSTGRES_DB: training_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_only
    ports:
      - "5433:5432"
    volumes:
      - training-platform-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local stand-in for Hetzner Object Storage (S3-compatible) — the storage service targets
  # the plain S3 API, so pointing it at real Hetzner Object Storage in staging/prod is a config
  # change only, not a code change.
  minio:
    image: minio/minio:latest
    container_name: training-platform-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_dev_only
      MINIO_ROOT_PASSWORD: minio_dev_only_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - training-platform-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  training-platform-postgres-data:
  training-platform-minio-data:
